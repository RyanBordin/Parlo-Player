[package]
name = "parlo-player"
version = "0.1.0"
description = "Desktop client for Subsonic / OpenSubsonic servers"
authors = ["Ryan Bordin"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "parlo_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "query", "form", "http2", "charset"] }
md-5 = "0.11.0"
rand = "0.10.3"
thiserror = "2.0.21"
keyring = "4.2.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
libmpv2 = { version = "6.0.0", default-features = false }
icu_normalizer = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
tauri-plugin-log = "2.10.1"
tauri-plugin-opener = "2.7.2"
log = "0.4.34"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[features]
# Development only: opens a made-up library of 50 000 songs instead of the
# real one, to measure performance (`npm run tauri:perf`, spec 12.3).
perf-library = []

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
dotenvy = "0.15.7"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
