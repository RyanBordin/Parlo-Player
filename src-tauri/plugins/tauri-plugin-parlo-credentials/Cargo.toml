[package]
name = "tauri-plugin-parlo-credentials"
version = "0.1.0"
description = "Password storage for Parlo Player on Android, with a key kept in the Android Keystore"
authors = ["Ryan Bordin"]
edition = "2024"
# Tauri's plugin build script needs `links` to pass the Android project to the app.
links = "tauri-plugin-parlo-credentials"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
